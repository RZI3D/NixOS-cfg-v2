# tack pins
# edit by hand or with tack add / rm / alias
# nix reads pins.lock.json
# this file drives tack update

# shorturl schemes
# scheme rest expands rest into {path}
[shorturls]
# gh = "github:{path}"

# all_follow maps input names to the top-level pin they follow
# opt out per-input with exclude_follow
[all_follow]
nixpkgs = "nixpkgs"
flake-utils = "flake-utils"
# nixpkgs = ["nixpkgs-stable", "nixpkgs-unstable"]

# inputs.<name> fields
#   url             required, shorturl ok, ?rev=<sha> pins an exact commit
#   type            flake (default), fetch, or fixed
#   flake           legacy false means type = "fetch"
#   follows         { child = "pin" } override map
#   exclude_follow  all_follow names to skip
#   dir             subdir holding flake.nix
#   submodules      fetch git submodules
#   unpack          fixed-only tarball or file
[inputs]

[inputs.nixpkgs]
url = "https://channels.nixos.org/nixos-unstable/nixexprs.tar.xz"

[inputs.flake-parts]
url = "github:hercules-ci/flake-parts"

[inputs.wrapper-modules]
url = "github:BirdeeHub/nix-wrapper-modules"

[inputs.home-manager]
url = "github:nix-community/home-manager"

[inputs.nix4vscode]
url = "github:nix-community/nix4vscode"

[inputs.catppuccin]
url = "github:catppuccin/nix"

[inputs.noctalia]
url = "github:noctalia-dev/noctalia/cachix"
exclude_follow = ["nixpkgs"]

[inputs.sops-nix]
url = "github:Mic92/sops-nix"

[inputs.nix-cachyos-kernel]
url = "github:xddxdd/nix-cachyos-kernel/release"

[inputs.dolphin-overlay]
url = "github:RZI3D/dolphin-overlay"

[inputs.spicetify-nix]
url = "github:Gerg-L/spicetify-nix"

[inputs.nix-minecraft]
url = "github:Infinidoge/nix-minecraft"

[inputs.nixgl]
url = "github:nix-community/nixGL"

[inputs.helium-flake]
url = "github:oxcl/nix-flake-helium-browser"

[inputs.rzi-plotter]
url = "path:pkgs/rzi-inkscape-plotter-tools"

[inputs.playit-nixos-module]
url = "github:pedorich-n/playit-nixos-module"

[inputs.nix-flatpak]
url = "github:gmodena/nix-flatpak"

[inputs.noctalia-greeter]
url = "github:noctalia-dev/noctalia-greeter"

[inputs.flake-utils]
url = "github:numtide/flake-utils"

[inputs.nix-index-database]
url = "github:nix-community/nix-index-database"

[inputs.umbriel]
url = "git+https://github.com/noctalia-dev/umbriel"
submodules = true
